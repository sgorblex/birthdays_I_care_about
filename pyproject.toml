[project]
name = "birthdays-i-care-about"
version = "0.1.0"
description = "Script to automatically add birthday events to Google Calendar for selected contacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.3",
]

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.39.0",
    "google-auth-oauthlib-stubs>=1.2.0",
    "mypy>=1.20.2,<2",
    "ruff>=0.14.14,<0.15",
]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = [
  "A", "ANN", "B", "C4", "DTZ", "E", "EXE", "F", "FA", "I", "ICN", "ISC", "LOG", "N",
  "PIE", "PLE", "PLW", "PT", "PYI", "Q", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "TC",
  "TID", "UP", "W", "YTT",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "google_auth_oauthlib.*",
    "google_auth_oauthlib.flow",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "googleapiclient.discovery"
disable_error_code = ["attr-defined"]
